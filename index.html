<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DieCast Den — Official Store</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React and React DOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-white text-slate-900 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG Icons Helper Components
    const Sparkles = ({ className }) => <i data-lucide="sparkles" class={className}></i>;
    const Search = ({ className }) => <i data-lucide="search" class={className}></i>;
    const ShoppingBag = ({ className }) => <i data-lucide="shopping-bag" class={className}></i>;
    const Plus = ({ className }) => <i data-lucide="plus" class={className}></i>;
    const Minus = ({ className }) => <i data-lucide="minus" class={className}></i>;
    const Trash2 = ({ className }) => <i data-lucide="trash-2" class={className}></i>;
    const ArrowRight = ({ className }) => <i data-lucide="arrow-right" class={className}></i>;
    const CheckCircle2 = ({ className }) => <i data-lucide="check-circle-2" class={className}></i>;
    const Phone = ({ className }) => <i data-lucide="phone" class={className}></i>;
    const X = ({ className }) => <i data-lucide="x" class={className}></i>;
    const ChevronLeft = ({ className }) => <i data-lucide="chevron-left" class={className}></i>;

    // Initial Products Data
    const INITIAL_PRODUCTS = [
      {
        id: 1,
        title: "Hot Wheels Track Stars - ₹1 Collector Test Token",
        subtitle: "1:64 Scale Special Test Diecast Model",
        price: 1,
        category: "Mainline",
        rating: 5.0,
        badge: "TEST PRODUCT",
        inStock: true,
        image: "https://images.unsplash.com/photo-1594787318286-3d835c1d207f?auto=format&fit=crop&q=80&w=800"
      },
      {
        id: 2,
        title: "Hot Wheels Premium Boulevard - Nissan Skyline GT-R (R34)",
        subtitle: "Real Riders Rubber Tires & Full Metal Body",
        price: 999,
        category: "Premium",
        rating: 4.9,
        badge: "HOT ITEM",
        inStock: true,
        image: "https://images.unsplash.com/photo-1581235720704-06d3acfcb36f?auto=format&fit=crop&q=80&w=800"
      },
      {
        id: 3,
        title: "Matchbox Collectors - 1970 Porsche 911 Carrera",
        subtitle: "Opening Doors with Detailed Interior",
        price: 1499,
        category: "Matchbox",
        rating: 4.8,
        badge: "COLLECTOR EDITION",
        inStock: true,
        image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=800"
      },
      {
        id: 4,
        title: "Mini GT - LB-Works Toyota GR Supra (Blue Metallic)",
        subtitle: "1:64 Scale High-Precision Resin Diecast",
        price: 1899,
        category: "Mini GT",
        rating: 5.0,
        badge: "LIMITED DIECAST",
        inStock: true,
        image: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&q=80&w=800"
      },
      {
        id: 5,
        title: "Hot Wheels RLC Exclusive - 1969 Dodge Charger R/T",
        subtitle: "Spectraflame Yellow & Real Riders Wheels",
        price: 4999,
        category: "RLC Exclusive",
        rating: 5.0,
        badge: "RLC RARE",
        inStock: true,
        image: "https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?auto=format&fit=crop&q=80&w=800"
      }
    ];

    // Initial Carousel Banners
    const INITIAL_BANNERS = [
      {
        id: 1,
        title: "DIECAST DEN EXCLUSIVES",
        subtitle: "Pre-order Premium Hot Wheels Boulevard & Car Culture Series Now!",
        badge: "NEW ARRIVALS 2026",
        image: "https://images.unsplash.com/photo-1581235720704-06d3acfcb36f?auto=format&fit=crop&q=80&w=1200"
      },
      {
        id: 2,
        title: "MINI GT & TARMAC WORKS",
        subtitle: "High precision 1:64 scale collectibles for serious enthusiasts.",
        badge: "LIMITED STOCK",
        image: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&q=80&w=1200"
      },
      {
        id: 3,
        title: "MATCHBOX COLLECTORS EDITION",
        subtitle: "True to life models with opening parts & rubber tires.",
        badge: "AUTHENTIC MODELS",
        image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1200"
      },
      {
        id: 4,
        title: "TEST PURCHASES AT ₹1",
        subtitle: "Try ordering test tokens with instant auto-verified UPI payment!",
        badge: "HOT DEAL",
        image: "https://images.unsplash.com/photo-1594787318286-3d835c1d207f?auto=format&fit=crop&q=80&w=1200"
      }
    ];

    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [banners, setBanners] = useState(INITIAL_BANNERS);
      const [activeBannerIndex, setActiveBannerIndex] = useState(0);

      const [searchQuery, setSearchQuery] = useState('');
      const [showSuggestions, setShowSuggestions] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('All');

      const [cart, setCart] = useState([]);
      const [checkoutForm, setCheckoutForm] = useState({
        fullName: '',
        phone: '',
        address: '',
        pincode: '',
        paymentMode: 'UPI'
      });

      const [orders, setOrders] = useState([]);
      const [currentOrder, setCurrentOrder] = useState(null);
      const [productToDelete, setProductToDelete] = useState(null);
      const [bannerSaveMsg, setBannerSaveMsg] = useState(false);

      const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
      const [showPinModal, setShowPinModal] = useState(false);
      const [enteredPin, setEnteredPin] = useState('');
      const [adminTab, setAdminTab] = useState('inventory');

      const [newProduct, setNewProduct] = useState({
        title: '',
        subtitle: '',
        price: '',
        category: 'Mainline',
        image: ''
      });

      const categories = ['All', 'Mainline', 'Premium', 'Matchbox', 'Mini GT', 'RLC Exclusive'];

      const searchSuggestions = products
        .filter(p => p.title.toLowerCase().includes(searchQuery.toLowerCase()) || p.category.toLowerCase().includes(searchQuery.toLowerCase()))
        .slice(0, 5);

      useEffect(() => {
        const timer = setInterval(() => {
          setActiveBannerIndex((prev) => (prev + 1) % banners.length);
        }, 4500);
        return () => clearInterval(timer);
      }, [banners.length]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const handleLogoClick = () => {
        setIsAdminUnlocked(true);
      };

      const addToCart = (product) => {
        setCart((prev) => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const updateCartQty = (id, delta) => {
        setCart((prev) => 
          prev
            .map(item => item.id === id ? { ...item, qty: item.qty + delta } : item)
            .filter(item => item.qty > 0)
        );
      };

      const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const totalCartCount = cart.reduce((sum, item) => sum + item.qty, 0);

      const handleImageFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setNewProduct(prev => ({ ...prev, image: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleBannerFileUpload = (index, e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setBanners(prev => prev.map((b, i) => i === index ? { ...b, image: reader.result } : b));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!newProduct.title || !newProduct.price || !newProduct.image) return;

        const productToAdd = {
          id: Date.now(),
          title: newProduct.title,
          subtitle: newProduct.subtitle || 'Collector Diecast Model',
          price: parseFloat(newProduct.price),
          category: newProduct.category,
          rating: 5.0,
          badge: "NEW IN STOCK",
          inStock: true,
          image: newProduct.image
        };

        setProducts(prev => [productToAdd, ...prev]);
        setNewProduct({ title: '', subtitle: '', price: '', category: 'Mainline', image: '' });
      };

      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (enteredPin === '1322') {
          setShowPinModal(false);
          setEnteredPin('');
          setCurrentPage('admin');
        } else {
          alert("Invalid Security PIN");
          setEnteredPin('');
        }
      };

      const handleProceedFromCheckout = (e) => {
        e.preventDefault();
        if (!checkoutForm.fullName || !checkoutForm.phone || !checkoutForm.address || !checkoutForm.pincode) {
          alert("Please fill all mandatory shipping details!");
          return;
        }

        if (checkoutForm.paymentMode === 'UPI') {
          setCurrentPage('upi');
        } else {
          completeOrder('Cash on Delivery (Pending)');
        }
      };

      const completeOrder = (paymentStatus) => {
        const orderData = {
          orderId: 'DCD-' + Math.floor(100000 + Math.random() * 900000),
          date: new Date().toLocaleString('en-IN'),
          customer: { ...checkoutForm },
          items: [...cart],
          amount: cartSubtotal,
          paymentMethod: checkoutForm.paymentMode,
          paymentStatus: paymentStatus
        };

        setOrders(prev => [orderData, ...prev]);
        setCurrentOrder(orderData);
        setCart([]);
        setCurrentPage('bill');
      };

      const filteredProducts = products.filter(p => {
        const matchesCategory = selectedCategory === 'All' || p.category === selectedCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || p.category.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      const exactUPIUrl = `upi://pay?pa=utkarshsawant2005@oksbi&pn=Utkarsh%20Sawant&am=${cartSubtotal}&cu=INR&tn=DieCast%20Den%20Order`;
      const qrCodeImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(exactUPIUrl)}`;

      return (
        <div className="min-h-screen bg-white text-slate-900 font-sans flex flex-col antialiased selection:bg-yellow-400 selection:text-blue-900">

          {/* Top Bar */}
          <div className="bg-blue-600 text-white text-xs py-2 px-4 text-center font-black tracking-widest uppercase flex items-center justify-center gap-2 shadow-sm">
            <Sparkles className="w-4 h-4 animate-bounce text-yellow-300" />
            <span className="drop-shadow-sm text-white">DieCast Den — Official Collector Store • Hot Wheels • Mini GT • Matchbox</span>
          </div>

          {/* Header */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b-4 border-yellow-400 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">

              <div 
                onClick={handleLogoClick}
                className="cursor-pointer select-none flex items-center gap-1 py-1 px-2 rounded-xl hover:bg-slate-50 transition"
              >
                <span className="text-2xl sm:text-3xl font-black tracking-tighter text-slate-950 uppercase">DIECAST</span>
                <span className="text-2xl sm:text-3xl font-black tracking-tighter text-red-600 uppercase">DEN</span>
              </div>

              {/* Search Bar */}
              <div className="flex-1 max-w-xl relative hidden md:block">
                <div className="relative">
                  <input
                    type="text"
                    placeholder="Search Hot Wheels, Skyline, Supra, Porsche..."
                    value={searchQuery}
                    onChange={(e) => {
                      setSearchQuery(e.target.value);
                      setShowSuggestions(true);
                    }}
                    onFocus={() => setShowSuggestions(true)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        setShowSuggestions(false);
                        setCurrentPage('search');
                      }
                    }}
                    className="w-full bg-slate-50 border-2 border-slate-200 focus:border-blue-600 rounded-full py-2.5 pl-11 pr-10 text-sm text-slate-900 placeholder-slate-400 focus:outline-none transition shadow-inner"
                  />
                  <Search className="w-5 h-5 text-blue-600 absolute left-3.5 top-3" />
                  {searchQuery && (
                    <button 
                      onClick={() => setSearchQuery('')}
                      className="absolute right-3 top-3 text-slate-400 hover:text-slate-600"
                    >
                      <X className="w-4 h-4" />
                    </button>
                  )}
                </div>

                {showSuggestions && searchQuery.trim() !== '' && (
                  <div className="absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl shadow-2xl border-2 border-blue-600 overflow-hidden z-50">
                    {searchSuggestions.length > 0 ? (
                      <div>
                        <div className="p-2 text-[11px] font-black text-blue-700 uppercase tracking-wider bg-yellow-100 border-b border-yellow-200">Suggested Models</div>
                        {searchSuggestions.map((item) => (
                          <div
                            key={item.id}
                            onClick={() => {
                              setSearchQuery(item.title);
                              setShowSuggestions(false);
                              setCurrentPage('search');
                            }}
                            className="p-3 hover:bg-blue-50 cursor-pointer flex items-center justify-between border-b border-slate-100 transition"
                          >
                            <div className="flex items-center gap-3">
                              <img src={item.image} alt="" className="w-10 h-10 object-cover rounded-md border border-slate-200" />
                              <div>
                                <p className="text-xs font-bold text-slate-900 line-clamp-1">{item.title}</p>
                                <span className="text-[10px] text-blue-600 font-semibold">{item.category}</span>
                              </div>
                            </div>
                            <span className="text-xs font-black text-blue-700">₹{item.price}</span>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="p-4 text-center text-xs text-slate-500">No matching diecast models found</div>
                    )}
                  </div>
                )}
              </div>

              <div className="flex items-center gap-4">
                <button
                  onClick={() => setCurrentPage('home')}
                  className={`text-xs font-black uppercase tracking-wider px-4 py-2 rounded-xl transition border ${currentPage === 'home' ? 'text-blue-700 border-blue-600 bg-blue-50' : 'text-slate-600 border-transparent hover:text-slate-900 hover:bg-slate-100'}`}
                >
                  Store
                </button>

                <button
                  onClick={() => setCurrentPage('cart')}
                  className="relative p-2.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl transition shadow-md flex items-center gap-2 border-b-2 border-yellow-400"
                >
                  <ShoppingBag className="w-5 h-5 text-yellow-300" />
                  <span className="text-xs font-black hidden sm:inline uppercase tracking-wider">Cart</span>
                  {totalCartCount > 0 && (
                    <span className="absolute -top-2 -right-2 bg-yellow-400 text-slate-950 font-black text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow-md">
                      {totalCartCount}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </header>

          {/* Body Section */}
          <div className="flex-1 bg-white">
            {currentPage === 'home' && (
              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">
                <div className="relative rounded-3xl overflow-hidden shadow-2xl border-2 border-blue-600 bg-slate-950 h-64 sm:h-96">
                  <div 
                    className="flex h-full transition-transform duration-700 ease-in-out"
                    style={{ transform: `translateX(-${activeBannerIndex * 100}%)` }}
                  >
                    {banners.map((slide, idx) => (
                      <div key={slide.id || idx} className="min-w-full h-full relative flex-shrink-0">
                        <img 
                          src={slide.image} 
                          alt={slide.title} 
                          className="w-full h-full object-cover opacity-80"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/50 to-transparent p-6 sm:p-12 flex flex-col justify-end">
                          <span className="inline-block bg-yellow-400 text-slate-950 text-[10px] sm:text-xs font-black uppercase px-3 py-1 rounded-full w-fit tracking-wider mb-2 shadow-md border border-yellow-500">
                            {slide.badge}
                          </span>
                          <h1 className="text-2xl sm:text-4xl font-black text-white uppercase tracking-tight max-w-2xl drop-shadow-lg">
                            {slide.title}
                          </h1>
                          <p className="text-slate-200 text-xs sm:text-sm font-medium mt-1 max-w-xl drop-shadow">
                            {slide.subtitle}
                          </p>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="absolute bottom-4 left-6 sm:left-12 flex gap-2.5 z-10">
                    {banners.map((_, idx) => (
                      <button
                        key={idx}
                        onClick={() => setActiveBannerIndex(idx)}
                        className={`h-2.5 rounded-full transition-all duration-300 ${activeBannerIndex === idx ? 'w-10 bg-yellow-400 ring-2 ring-yellow-300' : 'w-2.5 bg-white/60 hover:bg-white'}`}
                      />
                    ))}
                  </div>
                </div>

                <div className="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
                  {categories.map(cat => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategory(cat)}
                      className={`px-5 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider whitespace-nowrap transition border ${
                        selectedCategory === cat 
                          ? 'bg-blue-600 text-white border-blue-700 shadow-md scale-105' 
                          : 'bg-white text-slate-700 border-slate-200 hover:border-blue-600 hover:text-blue-600'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

                <div>
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="text-xl font-black text-slate-900 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-3 h-6 bg-yellow-400 rounded-sm inline-block"></span> Available Collectibles
                    </h2>
                    <span className="text-xs text-slate-500 font-bold">{filteredProducts.length} Items Listed</span>
                  </div>

                  {filteredProducts.length > 0 ? (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                      {filteredProducts.map(product => (
                        <div key={product.id} className="bg-white rounded-2xl border-2 border-slate-200 hover:border-blue-600 overflow-hidden shadow-sm hover:shadow-xl transition duration-300 flex flex-col group">
                          <div className="relative aspect-square overflow-hidden bg-slate-50 border-b border-slate-100">
                            <img 
                              src={product.image} 
                              alt={product.title} 
                              className="w-full h-full object-cover group-hover:scale-105 transition duration-500"
                            />
                            <span className="absolute top-3 left-3 bg-blue-600 text-white text-[10px] font-black uppercase px-2.5 py-1 rounded-md shadow-sm">
                              {product.category}
                            </span>
                            {product.price === 1 && (
                              <span className="absolute top-3 right-3 bg-yellow-400 text-slate-950 text-[10px] font-black uppercase px-2.5 py-1 rounded-md animate-pulse shadow-md border border-yellow-500">
                                ₹1 TEST ITEM
                              </span>
                            )}
                          </div>

                          <div className="p-4 flex-1 flex flex-col justify-between space-y-3">
                            <div>
                              <h3 className="font-bold text-slate-900 text-sm line-clamp-1 group-hover:text-blue-600 transition">{product.title}</h3>
                              <p className="text-slate-500 text-xs line-clamp-1 mt-0.5">{product.subtitle}</p>
                            </div>

                            <div className="flex items-center justify-between pt-3 border-t border-slate-100">
                              <div>
                                <p className="text-slate-400 font-bold uppercase text-[9px]">Price</p>
                                <p className="text-lg font-black text-blue-700">₹{product.price.toLocaleString('en-IN')}</p>
                              </div>

                              <button
                                onClick={() => addToCart(product)}
                                className="bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-black p-2.5 rounded-xl transition shadow flex items-center gap-1 text-xs border border-yellow-500 active:scale-95"
                              >
                                <Plus className="w-4 h-4 text-slate-950" /> Add
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="bg-slate-50 rounded-2xl border border-slate-200 p-12 text-center space-y-3">
                      <Search className="w-12 h-12 text-slate-400 mx-auto" />
                      <h3 className="text-lg font-bold text-slate-700">No Diecast Models Found</h3>
                      <p className="text-xs text-slate-500">Try searching for Hot Wheels, Supra, GT-R, or Porsche</p>
                    </div>
                  )}
                </div>
              </main>
            )}

            {currentPage === 'search' && (
              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
                <div className="flex items-center justify-between">
                  <h1 className="text-2xl font-black text-slate-900 uppercase tracking-tight flex items-center gap-2">
                    <Search className="w-6 h-6 text-blue-600" /> Search Results for "{searchQuery}"
                  </h1>
                  <button 
                    onClick={() => setCurrentPage('home')}
                    className="text-xs font-bold text-blue-600 hover:underline flex items-center gap-1"
                  >
                    <ChevronLeft className="w-4 h-4" /> Back to All Products
                  </button>
                </div>

                {filteredProducts.length > 0 ? (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    {filteredProducts.map(product => (
                      <div key={product.id} className="bg-white rounded-2xl border-2 border-slate-200 hover:border-blue-600 overflow-hidden shadow-sm transition flex flex-col">
                        <img src={product.image} alt={product.title} className="w-full aspect-square object-cover" />
                        <div className="p-4 space-y-2 flex-1 flex flex-col justify-between">
                          <div>
                            <span className="text-[10px] font-black text-blue-600 uppercase">{product.category}</span>
                            <h3 className="font-bold text-slate-900 text-sm line-clamp-1">{product.title}</h3>
                          </div>
                          <div className="flex items-center justify-between pt-2 border-t border-slate-100">
                            <span className="text-lg font-black text-blue-700">₹{product.price.toLocaleString('en-IN')}</span>
                            <button onClick={() => addToCart(product)} className="bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-black p-2 rounded-xl text-xs">Add to Cart</button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="bg-slate-50 rounded-2xl border border-slate-200 p-12 text-center space-y-3">
                    <Search className="w-12 h-12 text-slate-400 mx-auto" />
                    <h3 className="text-lg font-bold text-slate-700">No Diecast Models Found</h3>

          </footer>

          {/* Admin PIN Modal */}
          {showPinModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border-2 border-blue-600 rounded-2xl p-6 max-w-xs w-full shadow-2xl space-y-4">
                <h3 className="font-black text-sm uppercase text-slate-900 text-center">Enter PIN</h3>

                <form onSubmit={handlePinSubmit} className="space-y-3">
                  <input
                    type="password"
                    maxLength="4"
                    autoFocus
                    placeholder="****"
                    value={enteredPin}
                    onChange={(e) => setEnteredPin(e.target.value)}
                    className="w-full text-center text-lg font-mono tracking-widest bg-slate-50 border border-slate-200 text-slate-900 rounded-xl p-3 focus:outline-none focus:border-blue-600"
                  />

                  <div className="flex gap-2">
                    <button type="button" onClick={() => setShowPinModal(false)} className="w-1/2 bg-slate-100 text-slate-700 py-2.5 rounded-xl text-xs font-bold hover:bg-slate-200">
                      Cancel
                    </button>
                    <button type="submit" className="w-1/2 bg-yellow-400 hover:bg-yellow-500 text-slate-950 py-2.5 rounded-xl text-xs font-bold border border-yellow-500">
                      Submit
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Delete Confirmation Modal */}
          {productToDelete && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border-2 border-red-600 rounded-2xl p-6 max-w-xs w-full shadow-2xl space-y-4 text-center">
                <h3 className="font-black text-sm uppercase text-slate-900">Confirm Deletion</h3>
                <p className="text-xs text-slate-600">Are you sure you want to delete <span className="font-bold text-slate-900 font-mono">"{productToDelete.title}"</span>?</p>
                <div className="flex gap-2 pt-2">
                  <button 
                    onClick={() => setProductToDelete(null)} 
                    className="w-1/2 bg-slate-100 text-slate-700 py-2.5 rounded-xl text-xs font-bold hover:bg-slate-200"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={() => {
                      setProducts(products.filter(item => item.id !== productToDelete.id));
                      setProductToDelete(null);
                    }} 
                    className="w-1/2 bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl text-xs font-bold shadow"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
