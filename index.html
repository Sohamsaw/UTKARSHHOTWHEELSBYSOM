<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UTKARSH HOTWHEELS & DIECAST STORE</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel CDN for compiling JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-white text-slate-900 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ name, className = "w-5 h-5" }) => {
      return <i data-lucide={name} className={className}></i>;
    };

    const INITIAL_PRODUCTS = [
      {
        id: 1,
        title: "Hot Wheels Track Stars - ₹1 Collector Test Token",
        subtitle: "1:64 Scale Special Test Diecast Model",
        price: 1,
        category: "Mainline",
        rating: 5.0,
        badge: "TEST PRODUCT",
        inStock: true,
        image: "https://images.unsplash.com/photo-1594787318286-3d835c1d207f?auto=format&fit=crop&q=80&w=800"
      },
      {
        id: 2,
        title: "Hot Wheels Premium Boulevard - Nissan Skyline GT-R (R34)",
        subtitle: "Real Riders Rubber Tires & Full Metal Body",
        price: 999,
        category: "Premium",
        rating: 4.9,
        badge: "HOT ITEM",
        inStock: true,
        image: "https://images.unsplash.com/photo-1581235720704-06d3acfcb36f?auto=format&fit=crop&q=80&w=800"
      },
      {
        id: 3,
        title: "Matchbox Collectors - 1970 Porsche 911 Carrera",
        subtitle: "Opening Doors with Detailed Interior",
        price: 1499,
        category: "Matchbox",
        rating: 4.8,
        badge: "COLLECTOR EDITION",
        inStock: true,
        image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=800"
      },
      {
        id: 4,
        title: "Mini GT - LB-Works Toyota GR Supra (Blue Metallic)",
        subtitle: "1:64 Scale High-Precision Resin Diecast",
        price: 1899,
        category: "Mini GT",
        rating: 5.0,
        badge: "LIMITED DIECAST",
        inStock: true,
        image: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&q=80&w=800"
      },
      {
        id: 5,
        title: "Hot Wheels RLC Exclusive - 1969 Dodge Charger R/T",
        subtitle: "Spectraflame Yellow & Real Riders Wheels",
        price: 4999,
        category: "RLC Exclusive",
        rating: 5.0,
        badge: "RLC RARE",
        inStock: true,
        image: "https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?auto=format&fit=crop&q=80&w=800"
      }
    ];

    const INITIAL_BANNERS = [
      {
        id: 1,
        title: "DIECAST DEN EXCLUSIVES",
        subtitle: "Pre-order Premium Hot Wheels Boulevard & Car Culture Series Now!",
        badge: "NEW ARRIVALS 2026",
        image: "https://images.unsplash.com/photo-1581235720704-06d3acfcb36f?auto=format&fit=crop&q=80&w=1200"
      },
      {
        id: 2,
        title: "MINI GT & TARMAC WORKS",
        subtitle: "High precision 1:64 scale collectibles for serious enthusiasts.",
        badge: "LIMITED STOCK",
        image: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&q=80&w=1200"
      },
      {
        id: 3,
        title: "MATCHBOX COLLECTORS EDITION",
        subtitle: "True to life models with opening parts & rubber tires.",
        badge: "AUTHENTIC MODELS",
        image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1200"
      },
      {
        id: 4,
        title: "TEST PURCHASES AT ₹1",
        subtitle: "Try ordering test tokens with instant auto-verified UPI payment!",
        badge: "HOT DEAL",
        image: "https://images.unsplash.com/photo-1594787318286-3d835c1d207f?auto=format&fit=crop&q=80&w=1200"
      }
    ];

    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [banners, setBanners] = useState(INITIAL_BANNERS);
      const [activeBannerIndex, setActiveBannerIndex] = useState(0);
      const [searchQuery, setSearchQuery] = useState('');
      const [showSuggestions, setShowSuggestions] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [cart, setCart] = useState([]);
      const [checkoutForm, setCheckoutForm] = useState({ fullName: '', phone: '', address: '', pincode: '', paymentMode: 'UPI' });
      const [orders, setOrders] = useState([]);
      const [currentOrder, setCurrentOrder] = useState(null);
      const [productToDelete, setProductToDelete] = useState(null);
      const [bannerSaveMsg, setBannerSaveMsg] = useState(false);
      const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
      const [logoClickCount, setLogoClickCount] = useState(0);
      const [showPinModal, setShowPinModal] = useState(false);
      const [enteredPin, setEnteredPin] = useState('');
      const [adminTab, setAdminTab] = useState('inventory');
      const [newProduct, setNewProduct] = useState({ title: '', subtitle: '', price: '', category: 'Mainline', image: '' });

      const categories = ['All', 'Mainline', 'Premium', 'Matchbox', 'Mini GT', 'RLC Exclusive'];

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      useEffect(() => {
        const timer = setInterval(() => {
          setActiveBannerIndex((prev) => (prev + 1) % banners.length);
        }, 4500);
        return () => clearInterval(timer);
      }, [banners.length]);

      const handleLogoClick = () => {
        setLogoClickCount((prev) => {
          const next = prev + 1;
          if (next >= 3) {
            setIsAdminUnlocked((adminPrev) => !adminPrev);
            return 0;
          }
          return next;
        });
        setTimeout(() => setLogoClickCount(0), 1500);
      };

      const addToCart = (product) => {
        setCart((prev) => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const updateCartQty = (id, delta) => {
        setCart((prev) => 
          prev
            .map(item => item.id === id ? { ...item, qty: item.qty + delta } : item)
            .filter(item => item.qty > 0)
        );
      };

      const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const totalCartCount = cart.reduce((sum, item) => sum + item.qty, 0);

      const handleImageFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setNewProduct(prev => ({ ...prev, image: reader.result }));
          reader.readAsDataURL(file);
        }
      };

      const handleBannerFileUpload = (index, e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setBanners(prev => prev.map((b, i) => i === index ? { ...b, image: reader.result } : b));
          reader.readAsDataURL(file);
        }
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!newProduct.title || !newProduct.price || !newProduct.image) return;
        const productToAdd = {
          id: Date.now(),
          title: newProduct.title,
          subtitle: newProduct.subtitle || 'Collector Diecast Model',
          price: parseFloat(newProduct.price),
          category: newProduct.category,
          rating: 5.0,
          badge: "NEW IN STOCK",
          inStock: true,
          image: newProduct.image
        };
        setProducts(prev => [productToAdd, ...prev]);
        setNewProduct({ title: '', subtitle: '', price: '', category: 'Mainline', image: '' });
      };

      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (enteredPin === '1322') {
          setShowPinModal(false);
          setEnteredPin('');
          setCurrentPage('admin');
        } else {
          alert("Invalid Security PIN");
          setEnteredPin('');
        }
      };

      const handleProceedFromCheckout = (e) => {
        e.preventDefault();
        if (!checkoutForm.fullName || !checkoutForm.phone || !checkoutForm.address || !checkoutForm.pincode) {
          alert("Please fill all mandatory shipping details!");
          return;
        }
        if (checkoutForm.paymentMode === 'UPI') {
          setCurrentPage('upi');
        } else {
          completeOrder('Cash on Delivery (Pending)');
        }
      };

      const completeOrder = (paymentStatus) => {
        const orderData = {
          orderId: 'DCD-' + Math.floor(100000 + Math.random() * 900000),
          date: new Date().toLocaleString('en-IN'),
          customer: { ...checkoutForm },
          items: [...cart],
          amount: cartSubtotal,
          paymentMethod: checkoutForm.paymentMode,
          paymentStatus: paymentStatus
        };
        setOrders(prev => [orderData, ...prev]);
        setCurrentOrder(orderData);
        setCart([]);
        setCurrentPage('bill');
      };

      const filteredProducts = products.filter(p => {
        const matchesCategory = selectedCategory === 'All' || p.category === selectedCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || p.category.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      const exactUPIUrl = `upi://pay?pa=utkarshsawant2005@oksbi&pn=Utkarsh%20Sawant&am=${cartSubtotal}&cu=INR&tn=DieCast%20Den%20Order`;
      const qrCodeImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(exactUPIUrl)}`;

      return (
        <div className="min-h-screen bg-white text-slate-900 font-sans flex flex-col antialiased selection:bg-yellow-400 selection:text-blue-900">
          <div className="bg-blue-600 text-white text-xs py-2 px-4 text-center font-black tracking-widest uppercase flex items-center justify-center gap-2 shadow-sm">
            <Icon name="sparkles" className="w-4 h-4 text-yellow-300" />
            <span>DieCast Den — Official Collector Store • Hot Wheels • Mini GT • Matchbox</span>
          </div>

          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b-4 border-yellow-400 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
              <div onClick={handleLogoClick} className="cursor-pointer select-none flex items-center gap-1 py-1 px-2 rounded-xl hover:bg-slate-50 transition">
                <span className="text-2xl sm:text-3xl font-black tracking-tighter text-slate-950 uppercase">DIECAST</span>
                <span className="text-2xl sm:text-3xl font-black tracking-tighter text-red-600 uppercase">DEN</span>
              </div>

              <div className="flex-1 max-w-xl relative hidden md:block">
                <div className="relative">
                  <input
                    type="text"
                    placeholder="Search Hot Wheels, Skyline, Supra, Porsche..."
                    value={searchQuery}
                    onChange={(e) => { setSearchQuery(e.target.value); setShowSuggestions(true); }}
                    onFocus={() => setShowSuggestions(true)}
                    onKeyDown={(e) => { if (e.key === 'Enter') { setShowSuggestions(false); setCurrentPage('search'); } }}
                    className="w-full bg-slate-50 border-2 border-slate-200 focus:border-blue-600 rounded-full py-2.5 pl-11 pr-10 text-sm text-slate-900 focus:outline-none transition"
                  />
                  <div className="absolute left-3.5 top-3 text-blue-600"><Icon name="search" className="w-5 h-5" /></div>
                </div>
              </div>

              <div className="flex items-center gap-4">
                <button onClick={() => setCurrentPage('home')} className={`text-xs font-black uppercase tracking-wider px-4 py-2 rounded-xl transition border ${currentPage === 'home' ? 'text-blue-700 border-blue-600 bg-blue-50' : 'text-slate-600 border-transparent hover:bg-slate-100'}`}>
                  Store
                </button>
                <button onClick={() => setCurrentPage('cart')} className="relative p-2.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl transition shadow-md flex items-center gap-2 border-b-2 border-yellow-400">
                  <Icon name="shopping-bag" className="w-5 h-5 text-yellow-300" />
                  <span className="text-xs font-black hidden sm:inline uppercase">Cart</span>
                  {totalCartCount > 0 && (
                    <span className="absolute -top-2 -right-2 bg-yellow-400 text-slate-950 font-black text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow-md">
                      {totalCartCount}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </header>

          <div className="flex-1 bg-white">
            {currentPage === 'home' && (
              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">
                <div className="relative rounded-3xl overflow-hidden shadow-2xl border-2 border-blue-600 bg-slate-950 h-64 sm:h-96">
                  <div className="flex h-full transition-transform duration-700 ease-in-out" style={{ transform: `translateX(-${activeBannerIndex * 100}%)` }}>
                    {banners.map((slide, idx) => (
                      <div key={slide.id || idx} className="min-w-full h-full relative flex-shrink-0">
                        <img src={slide.image} alt={slide.title} className="w-full h-full object-cover opacity-80" />
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/50 to-transparent p-6 sm:p-12 flex flex-col justify-end">
                          <span className="inline-block bg-yellow-400 text-slate-950 text-[10px] sm:text-xs font-black uppercase px-3 py-1 rounded-full w-fit mb-2">{slide.badge}</span>
                          <h1 className="text-2xl sm:text-4xl font-black text-white uppercase tracking-tight max-w-2xl">{slide.title}</h1>
                          <p className="text-slate-200 text-xs sm:text-sm font-medium mt-1">{slide.subtitle}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="absolute bottom-4 left-6 sm:left-12 flex gap-2.5 z-10">
                    {banners.map((_, idx) => (
                      <button key={idx} onClick={() => setActiveBannerIndex(idx)} className={`h-2.5 rounded-full transition-all duration-300 ${activeBannerIndex === idx ? 'w-10 bg-yellow-400' : 'w-2.5 bg-white/60'}`} />
                    ))}
                  </div>
                </div>

                <div className="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
                  {categories.map(cat => (
                    <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-5 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider whitespace-nowrap transition border ${selectedCategory === cat ? 'bg-blue-600 text-white border-blue-700 shadow-md scale-105' : 'bg-white text-slate-700 border-slate-200 hover:border-blue-600'}`}>
                      {cat}
                    </button>
                  ))}
                </div>

                <div>
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="text-xl font-black text-slate-900 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-3 h-6 bg-yellow-400 rounded-sm inline-block"></span> Available Collectibles
                    </h2>
                    <span className="text-xs text-slate-500 font-bold">{filteredProducts.length} Items</span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    {filteredProducts.map(product => (
                      <div key={product.id} className="bg-white rounded-2xl border-2 border-slate-200 hover:border-blue-600 overflow-hidden shadow-sm hover:shadow-xl transition duration-300 flex flex-col group">
                        <div className="relative aspect-square overflow-hidden bg-slate-50 border-b border-slate-100">
                          <img src={product.image} alt={product.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                          <span className="absolute top-3 left-3 bg-blue-600 text-white text-[10px] font-black uppercase px-2.5 py-1 rounded-md">{product.category}</span>
                        </div>
                        <div className="p-4 flex-1 flex flex-col justify-between space-y-3">
                          <div>
                            <h3 className="font-bold text-slate-900 text-sm line-clamp-1">{product.title}</h3>
                            <p className="text-slate-500 text-xs line-clamp-1 mt-0.5">{product.subtitle}</p>
                          </div>
                          <div className="flex items-center justify-between pt-3 border-t border-slate-100">
                            <div>
                              <p className="text-slate-400 font-bold uppercase text-[9px]">Price</p>
                              <p className="text-lg font-black text-blue-700">₹{product.price.toLocaleString('en-IN')}</p>
                            </div>
                            <button onClick={() => addToCart(product)} className="bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-black p-2.5 rounded-xl transition shadow flex items-center gap-1 text-xs border border-yellow-500">
                              + Add
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </main>
            )}

            {currentPage === 'cart' && (
              <main className="max-w-4xl mx-auto px-4 sm:px-6 py-8 space-y-6">
                <h1 className="text-2xl font-black text-slate-900 uppercase">Your Shopping Cart ({totalCartCount})</h1>
                {cart.length > 0 ? (
                  <div className="space-y-6">
                    <div className="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100 shadow-sm">
                      {cart.map((item) => (
                        <div key={item.id} className="p-4 sm:p-6 flex items-center justify-between gap-4">
                          <div className="flex items-center gap-4">
                            <img src={item.image} alt="" className="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded-xl border border-slate-200" />
                            <div>
                              <h3 className="font-bold text-slate-900 text-sm sm:text-base line-clamp-1">{item.title}</h3>
                              <p className="text-xs font-black text-blue-700 mt-1">₹{item.price.toLocaleString('en-IN')}</p>
                            </div>
                          </div>
                          <div className="flex items-center gap-3">
                            <div className="flex items-center border border-slate-200 rounded-xl overflow-hidden bg-slate-50">
                              <button onClick={() => updateCartQty(item.id, -1)} className="p-2 text-slate-700">-</button>
                              <span className="px-3 font-bold text-xs text-slate-900">{item.qty}</span>
                              <button onClick={() => updateCartQty(item.id, 1)} className="p-2 text-slate-700">+</button>
                            </div>
                            <button onClick={() => updateCartQty(item.id, -item.qty)} className="p-2 text-slate-400 hover:text-red-600">Delete</button>
                          </div>
                        </div>
                      ))}
                    </div>
                    <div className="bg-blue-900 text-white rounded-2xl p-6 shadow-xl flex items-center justify-between border-2 border-yellow-400">
                      <div>
                        <p className="text-xs text-yellow-300 font-bold uppercase">Subtotal Amount</p>
                        <p className="text-3xl font-black text-white">₹{cartSubtotal.toLocaleString('en-IN')}</p>
                      </div>
                      <button onClick={() => setCurrentPage('checkout')} className="bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-black px-6 py-3.5 rounded-xl text-xs uppercase shadow-lg">
                        Proceed To Checkout →
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="bg-slate-50 rounded-2xl border border-slate-200 p-12 text-center space-y-4">
                    <h3 className="text-lg font-bold text-slate-700">Your Cart is Empty</h3>
                    <button onClick={() => setCurrentPage('home')} className="bg-blue-600 text-white font-bold px-6 py-3 rounded-xl text-xs uppercase">
                      Explore Models
                    </button>
                  </div>
                )}
              </main>
            )}

            {currentPage === 'checkout' && (
              <main className="max-w-2xl mx-auto px-4 sm:px-6 py-8 space-y-6">
                <h1 className="text-2xl font-black text-slate-900 uppercase">Shipping Details</h1>
                <form onSubmit={handleProceedFromCheckout} className="bg-white rounded-2xl border-2 border-slate-200 p-6 space-y-4 shadow-md">
                  <div>
                    <label className="text-xs font-bold text-slate-700 uppercase">Full Name *</label>
                    <input type="text" required placeholder="Utkarsh Sawant" value={checkoutForm.fullName} onChange={(e) => setCheckoutForm({ ...checkoutForm, fullName: e.target.value })} className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-700 uppercase">Phone Number *</label>
                    <input type="text" required maxLength="10" placeholder="9876543210" value={checkoutForm.phone} onChange={(e) => setCheckoutForm({ ...checkoutForm, phone: e.target.value.replace(/[^0-9]/g, '') })} className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-700 uppercase">Delivery Address *</label>
                    <textarea required rows="3" placeholder="Full Address..." value={checkoutForm.address} onChange={(e) => setCheckoutForm({ ...checkoutForm, address: e.target.value })} className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm"></textarea>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-700 uppercase">Pin Code *</label>
                    <input type="text" required maxLength="6" placeholder="400001" value={checkoutForm.pincode} onChange={(e) => setCheckoutForm({ ...checkoutForm, pincode: e.target.value.replace(/[^0-9]/g, '') })} className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm" />
                  </div>
                  <div className="pt-4 border-t border-slate-200 flex items-center justify-between">
                    <div>
                      <p className="text-xs text-slate-500 font-bold">Total Bill</p>
                      <p className="text-2xl font-black text-blue-700">₹{cartSubtotal.toLocaleString('en-IN')}</p>
                    </div>
                    <button type="submit" className="bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-black px-8 py-3.5 rounded-xl text-xs uppercase shadow-md">
                      Generate UPI QR Code
                    </button>
                  </div>
                </form>
              </main>
            )}

            {currentPage === 'upi' && (
              <main className="max-w-md mx-auto px-4 py-8 space-y-6">
                <div className="bg-white rounded-3xl border-2 border-blue-600 p-6 shadow-xl text-center space-y-4">
                  <span className="inline-block bg-yellow-400 text-slate-950 text-[10px] font-black uppercase px-3 py-1 rounded-full">Official UPI Payment</span>
                  <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-1">
                    <p className="text-xs font-bold text-slate-500 uppercase">Total Payable</p>
                    <p className="text-3xl font-black text-blue-700">₹{cartSubtotal.toLocaleString('en-IN')}</p>
                    <p className="text-xs font-mono font-bold text-slate-700">Merchant: Utkarsh Sawant</p>
                  </div>
                  <div className="p-4 bg-white rounded-2xl border-2 border-blue-600 inline-block">
                    <img src={qrCodeImageUrl} alt="UPI QR Code" className="w-56 h-56 mx-auto object-contain" />
                  </div>
                  <button onClick={() => completeOrder('UPI Online (Paid)')} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl text-xs uppercase shadow-md">
                    Confirm Payment Done
                  </button>
                </div>
              </main>
            )}

            {currentPage === 'bill' && currentOrder && (
              <main className="max-w-xl mx-auto px-4 py-8 space-y-6">
                <div className="bg-white rounded-3xl border-2 border-slate-200 p-8 shadow-xl space-y-6">
                  <div className="bg-blue-600 text-white text-center py-2 text-xs font-black uppercase rounded-xl">✓ Order Confirmed</div>
                  <div className="text-center space-y-1">
                    <h1 className="text-2xl font-black text-slate-900 uppercase">Thanks for Purchasing!</h1>
                    <p className="text-xs font-mono text-blue-700">Order ID: {currentOrder.orderId}</p>
                  </div>
                  <button onClick={() => setCurrentPage('home')} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-xs uppercase shadow">
                    Back To Storefront
                  </button>
                </div>
              </main>
            )}
          </div>

          <footer className="bg-slate-900 text-white border-t-4 border-yellow-400 mt-16 py-8 text-center text-xs text-slate-400">
            <p>© DieCast Den — All Rights Reserved</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
